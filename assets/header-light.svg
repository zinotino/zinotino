<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Automation and AI Agent Engineer">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#b88b5c" opacity="0.22"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="280" fill="#ffffff"/>
  <rect x="820" y="0" width="460" height="280" fill="url(#dots)"/>
  <rect x="760" y="0" width="300" height="280" fill="url(#fade)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="110" fill="#1f2328" font-size="46" font-weight="700" letter-spacing="-1.2">Automation &amp; AI Agent Engineer</text>
    <rect x="74" y="134" width="56" height="3" rx="1.5" fill="#b88b5c"/>
    <text x="74" y="176" fill="#8a5f2f" font-size="20" font-weight="600" letter-spacing="0.2">Agent systems &#183; LLM evaluation &#183; process automation</text>
    <text x="74" y="210" fill="#57606a" font-size="16.5" font-weight="400">I find the repetitive manual work nobody flagged, then ship the thing that removes it.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="74" y="244" fill="#6e7781">Chicago, IL</text>
    <text x="176" y="244" fill="#d0d7de">|</text>
    <text x="196" y="244" fill="#6e7781">Python &#183; Node &#183; Rust &#183; MCP &#183; Linux</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16">
    <text x="980" y="128" fill="#b88b5c">$</text>
    <text x="1004" y="128" fill="#57606a">notice --first</text>
    <text x="980" y="158" fill="#b88b5c">$</text>
    <text x="1004" y="158" fill="#57606a">build --second</text>
    <rect x="1004" y="176" width="11" height="18" fill="#b88b5c" opacity="0.85"/>
  </g>
</svg>
